.pubnav{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.pubnav a{padding:8px 12px;color:#333;text-decoration:none;border-radius:4px}
.ptitle{background:#f3f3f3;padding:14px 24px;border-bottom:1px solid #e5e5e5;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ptitle h1{margin:0;font-size:22px;font-weight:300;color:#1b1b1b}
.crumb{font-size:12px;color:#595959}
.shell{display:flex;flex-wrap:wrap;align-items:stretch;min-height:calc(100vh - 140px)}
.side{flex:1 1 220px;max-width:236px;background:#fafafa;border-right:1px solid #e5e5e5;padding:12px 0 24px}
.side-h{font-size:11px;font-weight:700;color:#595959;letter-spacing:.06em;padding:16px 20px 6px}

.side a:hover{background:#f0f0f0}

.cnt{float:right;background:#c0392b;color:#fff;border-radius:9px;font-size:11px;padding:0 7px;font-weight:700}
.main{flex:999 1 560px;min-width:0;padding:8px 28px 48px}
.wrap{max-width:1280px;margin:0 auto;padding:0 32px 48px}
.sec{font-size:17px;font-weight:300;text-transform:uppercase;border-left:2px solid #27ae60;border-bottom:1px solid #ddd;padding:2px 0 8px 12px;margin:26px 0 14px;color:#333}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.kpi{border:1px solid #e0e0e0;border-radius:6px;padding:14px 16px;background:#fff}
.kpi .l{font-size:12px;color:#595959;font-weight:600}

.kpi .s{font-size:12px;color:#595959;margin-top:2px}

.f{display:flex;flex-direction:column;gap:5px;font-weight:700;font-size:12px;color:#333}
.f input,.f select,.f textarea{font:inherit;font-weight:400;padding:7px 9px;border:1px solid #c8c8c8;border-radius:3px;background:#fff;color:#333}
.f .hint{font-weight:400;color:#595959;font-size:11px}
.btn{display:inline-block;background:#1e8449;color:#fff;border:1px solid #1e8449;border-radius:6px;padding:8px 16px;text-decoration:none;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{color:#fff;background:#196f3d}
.btn[disabled]{background:#9db8a8;border-color:#9db8a8;cursor:not-allowed}
.btn2{display:inline-block;background:#fff;color:#333;border:1px solid #c8c8c8;border-radius:6px;padding:8px 16px;text-decoration:none;cursor:pointer;white-space:nowrap}

.btnr{display:inline-block;background:#fff;color:#a61b1b;border:1px solid #d9a3a3;border-radius:6px;padding:8px 16px;cursor:pointer;white-space:nowrap}
.btns{padding:4px 10px;font-size:12px}
.tbl{overflow-x:auto;border:1px solid #e5e5e5;border-radius:4px}
table{width:100%;border-collapse:collapse}
th{color:#1e7a46;text-align:left;font-weight:700;font-size:12px;padding:10px;border-bottom:2px solid #d5ead9;white-space:nowrap;background:#fff}
td{padding:10px;border-bottom:1px solid #eee;vertical-align:top}

.empty{text-align:center;color:#595959;background:#f4faf6}

.dl dt{color:#595959;font-size:12px}.dl dd{margin:0;font-weight:600}
.bar{height:10px;background:#e9e9e9;border-radius:5px;overflow:hidden;position:relative}
.bar > div{height:100%;background:#1e8449;transition:width .3s}
.bar .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:#1b1b1b}

.seg button{padding:6px 14px;border-radius:13px;border:0;background:none;color:#333;font-size:12px;cursor:pointer}

.lf span{font-size:11px;font-weight:700;letter-spacing:.04em}
.lf input{border:0;font:inherit;font-size:15px;color:#263445;outline:none;padding:2px 0;background:transparent}
#toast{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:50}
#toast div{background:#1b1b1b;color:#fff;padding:12px 16px;border-radius:6px;max-width:380px;box-shadow:0 4px 14px rgba(0,0,0,.2);font-size:13px;line-height:1.5}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:40;padding:20px}
.modal{background:#fff;border-radius:8px;max-width:480px;width:100%;padding:22px 24px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal h3{margin:0 0 12px;font-size:17px;font-weight:600}
.cert{border:1px solid #c8c8c8;border-radius:6px;padding:26px 28px;background:#fff;display:flex;flex-direction:column;gap:14px}
.qty{width:100px;font:inherit;padding:5px 7px;border:1px solid #c8c8c8;border-radius:3px;text-align:right}
footer{border-top:1px solid #e5e5e5;padding:14px 24px;font-size:12px;color:#595959;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
</style>
</head>

// ---------- helpers ----------
const nf = n => Number(n).toLocaleString('en-US');
const rm = n => 'RM ' + Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const pad = n => String(n).padStart(7,'0');
const qtyOf = b => b.end - b.start + 1;
const ser = (p,s,e) => `${p}-${pad(s)}–${pad(e)}`;
const tag = (t,c) => `<span class="tag t-${c}">${t}</span>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(msg){ const box=document.getElementById('toast'); while(box.children.length>=2) box.firstChild.remove(); const d=document.createElement('div'); d.innerHTML=msg; box.appendChild(d); setTimeout(()=>d.remove(),3000); }
function log(who, what){ S.log.unshift({t:now(), who, what}); }
function modal(html){ document.getElementById('modal').innerHTML = html ? `<div class="modal-bg" role="dialog" aria-modal="true"><div class="modal">${html}</div></div>` : ''; }
function take(block, qty){ const s=block.start; block.start += qty; return [s, s+qty-1]; }

// ---------- routing ----------
const ADMIN = ['dashboard','accounts','projects','issuance','transfers','reports'];

// Navigation lives in page state only: the artifact viewer owns the URL hash, so it is never used for routing.
let CUR = 'public';
function view(){ return CUR; }
function go(v){ CUR = v; render(); try{ window.scrollTo(0,0); }catch(e){} }

// ---------- shell ----------
function pending(){
  return {
    accounts: S.accounts.filter(a=>a.status==='Pending KYC').length,
    projects: S.projects.filter(p=>['NRES decision','Submitted','State consent'].includes(p.stage)).length,
    issuance: S.issuances.filter(i=>i.status!=='Issued' && i.status!=='Rejected').length,
    transfers: (S.auth.status==='Pending'?1:0) + S.imports.filter(i=>i.lock!=='Confirmed').length
  };
}
function shell(v, body, actions=''){
  const p = pending();
  const admin = S.role==='admin';
  const nav = admin ? [
    ['REGISTRY OPERATIONS', [['dashboard','Dashboard'],['accounts','Accounts &amp; KYC',p.accounts],['projects','Project Registration',p.projects],['issuance','CCU Issuance',p.issuance],['transfers','Transfers &amp; Article 6',p.transfers]]],
    ['INSIGHT', [['reports','Reporting, Validity &amp; Policy'],['public','Public registry view']]]
  ] : [
    ['MY ACCOUNT · '+S.holder.acc, [['trading','Trading &amp; Payment'],['retirement','CCU Retirement'],['levy','Carbon Levy Offset']]],
    ['INSIGHT', [['public','Public registry view']]]
  ];
  const navh = nav.map(([h,items])=>`<div class="side-h">${h}</div>`+items.map(([k,l,c])=>`<a data-act="go" data-v="${k}" class="${k===v?'on':''}" ${k===v?'aria-current="page"':''}>${l}${c?`<span class="cnt">${c}</span>`:''}</a>`).join('')).join('');
  const who = admin ? 'Nur Aisyah · Registry Administrator, NRES' : `${S.holder.rep} · Authorised Representative, ${S.holder.name}`;
  return `
  <div class="topbar"><span>National Carbon Registry · Malaysia ${tag('Interactive prototype · sample data','a')}</span>
    <span style="display:flex;gap:16px;align-items:center">Welcome, ${who}
    <button class="link" data-act="switch">Switch role</button><button class="link" data-act="signout">Sign out</button></span></div>
  <header class="brand"><a class="logo" data-act="go" data-v="${admin?'dashboard':'trading'}">${LOGO}<span><span style="display:block;font-size:17px;font-weight:600">National Carbon Registry</span><span style="display:block;font-size:11px;color:#595959">CCU Registry · ${admin?'Administration':'Account holder portal'}</span></span></a>
    <span style="font-size:12px;color:#595959">Policy v${S.policy.version} · offset cap ${S.policy.cap}% · international threshold ${S.policy.intl}%</span></header>
  <div class="ptitle"><div><div class="crumb">Home / ${esc(TITLES[v])}</div><h1>${esc(TITLES[v])}</h1></div><div style="display:flex;gap:10px;flex-wrap:wrap">${actions}</div></div>
  <div class="shell"><nav class="side" aria-label="Registry modules">${navh}</nav><main class="main">${body}</main></div>`;
}

// ---------- public ----------

// ---------- holder: levy ----------
function levyCalc(){
  const L=S.levy, P=S.policy, cap=Math.round(L.emissions*P.cap/100);
  let selT=0, selI=0; const rows=[];
  S.blocks.filter(b=>qtyOf(b)>0).forEach(b=>{
    const elig = b.vintage>=P.minVintage && !b.auth;
    const why = b.vintage<P.minVintage ? `Vintage before ${P.minVintage}` : b.auth ? 'Authorised for Article 6' : '';
    const q = elig ? Math.min(parseInt(L.sel[b.id]||0)||0, qtyOf(b)) : 0;
    selT+=q; if(b.intl) selI+=q;
    rows.push({b,elig,why,q});
  });
  const totAfter=L.surrendered+selT, intlAfter=L.surrIntl+selI;
  const share = totAfter? intlAfter/totAfter*100 : 0;
  const capOk = totAfter<=cap, intlOk = share<=P.intl+1e-9, any=selT>0;
  const needDom = intlOk?0:Math.ceil(intlAfter/(P.intl/100) - totAfter);
  return {cap,selT,selI,totAfter,intlAfter,share,capOk,intlOk,any,needDom,rows};
}
function levyPanel(){
  const c=levyCalc(), P=S.policy;
  const capPct=Math.min(100,c.totAfter/c.cap*100);
  return `<div class="card"><h3>Live validation</h3>
    <div style="font-size:12px;color:#595959">Offset cap use after this surrender: <b>${nf(c.totAfter)}</b> of ${nf(c.cap)} tCO₂e (${P.cap}% of verified emissions)</div>

  login: () => { S.role=S.loginRole; log(S.role==='admin'?'Nur Aisyah':S.holder.rep, 'Signed in'); go(S.role==='admin'?'dashboard':'trading'); },
  signout: () => { S.role=null; go('public'); },
  switch: () => { S.role = S.role==='admin'?'holder':'admin'; toast(`Switched to the ${S.role==='admin'?'Registry Administrator':'account holder'} console`); go(S.role==='admin'?'dashboard':'trading'); },
  resetFilters: () => { S.filters={q:'',state:'',prog:''}; render(); },
  kyc: d => { const a=S.accounts.find(x=>x.no==='ACC-0151'); a.status=d.d; a.kyc=d.d==='Active'?'Verified':a.kyc; if(d.d==='Active') a.reps='2 active'; log('Nur Aisyah', `KYC decision ${a.no}: ${d.d}`); toast(`${a.no} ${a.holder}: ${d.d}`); render(); },
  selProject: d => { S.selProject=d.id; render(); },
  projDecide: d => { const p=S.projects.find(x=>x.no===S.selProject); p.stage=d.d; if(d.d==='Registered') p.use='Not authorised'; log('Nur Aisyah', `Project ${p.no}: ${d.d}`); toast(`${p.no} → ${d.d}`); render(); },
  projAdvance: () => { const order=['Submitted','State consent','Validation','NRES decision']; const p=S.projects.find(x=>x.no===S.selProject); const i=order.indexOf(p.stage); if(i>=0 && i<3){ p.stage=order[i+1]; log('System', `Project ${p.no} moved to ${p.stage}`); } render(); },
  selIss: d => { S.selIssuance=d.id; render(); },
  feePaid: () => { const i=S.issuances.find(x=>x.id===S.selIssuance); i.fee='Paid · FPX'; i.status='Checker approval'; log('Payment gateway', `Fee received for ${i.id}`); toast('FPX confirmed the issuance fee'); render(); },
  issue: d => {
    const i=S.issuances.find(x=>x.id===S.selIssuance);
    if(d.d==='Issued'){ const o=(document.getElementById('otp')||{}).value||''; if(!/^\d{6}$/.test(o)){ toast('Enter a 6-digit one-time password to approve.'); return; }
      const buf=Math.round(i.verified*i.buffer/100), net=i.verified-buf; i.status='Issued'; S.stats.issued+=i.verified;
      const p=S.projects.find(x=>x.no===i.project); if(p) p.issued+=i.verified;
      S.tx.unshift({t:now(), type:'Issuance', from:'Issuance account', to:i.acc, serial:ser(i.prefix,1,net), qty:net, amt:null, pay:'—', status:'Completed', mine:false});
      if(buf) S.tx.unshift({t:now(), type:'Buffer allocation', from:'Issuance account', to:'Buffer pool', serial:ser(i.prefix,net+1,i.verified), qty:buf, amt:null, pay:'—', status:'Completed', mine:false});
      log('Nur Aisyah', `Issued ${nf(i.verified)} CCU (${i.id})`); toast(`${nf(i.verified)} CCU issued · serials generated`);
    } else { i.status='Rejected'; log('Nur Aisyah', `Rejected ${i.id}`); }
    render(); },
  auth: d => {
    const a=S.auth;
    if(d.d==='Declined'){ a.status='Declined'; log('Nur Aisyah', `Declined ${a.id}`); render(); return; }
    const q=parseInt(((document.getElementById('authQty')||{}).value||'').replace(/,/g,''))||0;
    if(q<1||q>a.qty){ toast(`Enter a quantity between 1 and ${nf(a.qty)}.`); return; }
    a.status='Authorised'; a.approved=q; S.stats.itmo+=q;
    const serial=ser('MY-VCS-PHG-0007-2024-003',1,q);
    S.ca.push({t:now(), id:a.id, qty:q, serial});
    const p=S.projects.find(x=>x.no==='NCR-PRJ-PHG-0007'); if(p) p.use='NDC · Singapore (CA applied)';
    S.tx.unshift({t:now(), type:'International transfer · ITMO', from:'Sample Peat Trust', to:'Singapore registry', serial, qty:q, amt:null, pay:'—', status:'Completed', mine:false});
    log('Nur Aisyah', `Authorised ${nf(q)} ITMOs to Singapore, CA recorded`); toast(`Authorised ${nf(q)} tCO₂e · corresponding adjustment recorded`); render(); },
  lock: d => { const i=S.imports.find(x=>x.id===d.id); i.lock='Confirmed'; log('Verra API', `Lock confirmed for ${i.id}`); toast(`${i.id}: Verra lock confirmed, ${nf(i.qty)} units usable in NCR`); render(); },
  savePolicy: () => {
    const cap=+document.getElementById('pCap').value, intl=+document.getElementById('pIntl').value, vin=+document.getElementById('pVin').value;
    if(!(cap>=0&&cap<=100&&intl>=0&&intl<=100&&vin>2000)){ toast('Check the values: percentages 0–100, a valid year.'); return; }
    const P=S.policy, ch=[]; if(cap!==P.cap) ch.push(`cap ${P.cap}→${cap}%`); if(intl!==P.intl) ch.push(`international ${P.intl}→${intl}%`); if(vin!==P.minVintage) ch.push(`min vintage ${P.minVintage}→${vin}`);
    if(!ch.length){ toast('No change to save.'); return; }
    P.cap=cap; P.intl=intl; P.minVintage=vin; P.version++; P.history.push({v:P.version, at:now(), by:'Nur Aisyah', note:ch.join(', ')});
    log('Nur Aisyah', `Policy v${P.version}: ${ch.join(', ')}`); toast(`Policy v${P.version} saved`); render(); },
  remind: d => { const e=S.expiring[+d.k]; e.last=now()+' · email + SMS'; toast(`Reminder sent to ${e.acc}`); render(); },
  runReport: d => { log('Nur Aisyah', `Ran report: ${d.n}`); toast(`${d.n}: generated (prototype preview not included)`); },
  selLot: d => { S.trade.lot=d.id; S.trade.qty=Math.min(3000, S.lots.find(l=>l.id===d.id).qty); render(); },
  payMethod: d => { S.trade.method=d.m; },
  pay: () => {
    const t=S.trade, lot=S.lots.find(l=>l.id===t.lot), qty=parseInt(String(t.qty).replace(/,/g,''))||0, tot=qty*lot.price+Math.round(qty*0.1*100)/100;
    modal(`<h3>${t.method} · simulated</h3><dl class="dl"><dt>Merchant</dt><dd>National Carbon Registry escrow</dd><dt>Order</dt><dd>${lot.id} · ${nf(qty)} tCO₂e</dd><dt>Amount</dt><dd>${rm(tot)}</dd></dl>
      <label class="f" style="margin-top:14px">Bank<select><option>Sample Bank A</option><option>Sample Bank B</option></select></label>
      <div class="note" style="margin-top:12px">Prototype: no real payment is made.</div>
      <div class="actions"><button class="btn2" data-act="payCancel">Cancel</button><button class="btn" data-act="payOk">Approve payment</button></div>`); },
  payCancel: () => modal(''),
  payOk: () => {
    const t=S.trade, lot=S.lots.find(l=>l.id===t.lot), qty=parseInt(String(t.qty).replace(/,/g,''))||0, tot=qty*lot.price+Math.round(qty*0.1*100)/100;
    const s=lot.start; lot.start+=qty; lot.qty-=qty;
    S.blocks.push({id:'b'+Date.now(), prog:lot.prog, intl:lot.intl, vintage:lot.vintage, project:lot.project, prefix:lot.prefix, start:s, end:s+qty-1, valid:lot.valid, auth:false});
    const serial=ser(lot.prefix,s,s+qty-1);
    S.tx.unshift({t:now(), type:'Purchase', from:lot.seller, to:S.holder.name, serial, qty, amt:tot, pay:t.method+' · paid', status:'Delivered', mine:true});
    log(S.holder.rep, `Bought ${nf(qty)} CCU (${lot.id}), paid ${rm(tot)}`);
    modal(''); toast(`Payment confirmed · ${nf(qty)} CCU delivered to ${S.holder.acc}`);
    if(lot.qty<100) S.lots=S.lots.filter(l=>l.qty>=100);
    if(!S.lots.find(l=>l.id===t.lot)) t.lot=S.lots[0].id;
    t.qty=Math.min(3000,S.lots.find(l=>l.id===t.lot).qty); render(); },
  retire: () => {
    const r=S.ret, b=S.blocks.find(x=>x.id===r.block), qty=parseInt(String(r.qty).replace(/,/g,''))||0;
    if(!b||qty<1||qty>qtyOf(b)) return;
    const [s,e]=take(b,qty), serial=ser(b.prefix,s,e), t=now();
    r.seq++; r.cert={no:'RET-2026-00'+r.seq, qty, ben:r.ben, purpose:r.purpose, project:b.project, prog:b.prog, vintage:b.vintage, serial, claim:r.claim, t};
    S.stats.retired+=qty;
    S.tx.unshift({t, type:'Retirement · '+(r.purpose.startsWith('Domestic')?'Domestic NDC':'Voluntary claim'), from:r.ben, to:'Voluntary retirement account', serial, qty, amt:null, pay:'—', status:'Retired', mine:true});
    log(S.holder.rep, `Retired ${nf(qty)} CCU · certificate ${r.cert.no}`); toast(`Retired ${nf(qty)} CCU · certificate ${r.cert.no} issued`);
    r.qty=Math.min(1000, Math.max(0,qtyOf(b))); render(); },
  levyPreset: d => {
    const L=S.levy; L.sel={};
    const dom=S.blocks.find(b=>!b.intl && b.vintage>=S.policy.minVintage && qtyOf(b)>0), vcs=S.blocks.find(b=>b.intl && qtyOf(b)>0);
    if(d.p==='ok'){ if(dom) L.sel[dom.id]=Math.min(5000,qtyOf(dom)); if(vcs) L.sel[vcs.id]=Math.min(3000,qtyOf(vcs)); }
    if(d.p==='intl'){ let room=Math.round(S.levy.emissions*S.policy.cap/100)-S.levy.surrendered;
      S.blocks.filter(b=>b.intl && qtyOf(b)>0 && b.vintage>=S.policy.minVintage).sort((a,b)=>qtyOf(b)-qtyOf(a)).forEach(b=>{ const q=Math.min(qtyOf(b),room); if(q>0){ L.sel[b.id]=q; room-=q; } }); }
    render(); },
  surrender: () => {
    const c=levyCalc(); if(!(c.any&&c.capOk&&c.intlOk)) return;
    const t=now();
    c.rows.filter(r=>r.q>0).forEach(r=>{ const [s,e]=take(r.b,r.q), serial=ser(r.b.prefix,s,e);
      S.levy.done.push({t, serial, qty:r.q, intl:r.b.intl});
      S.tx.unshift({t, type:'Retirement · Carbon Levy', from:S.holder.name, to:'Levy surrender account', serial, qty:r.q, amt:null, pay:'—', status:'Retired', mine:true}); });
    S.levy.surrendered+=c.selT; S.levy.surrIntl+=c.selI; S.stats.retired+=c.selT; S.stats.levyRetired+=c.selT; S.levy.sel={};
    log(S.holder.rep, `Surrendered ${nf(c.selT)} CCU against Carbon Levy (international ${nf(c.selI)})`);
    toast(`Surrendered ${nf(c.selT)} CCU · result sent to the Carbon Levy system`); render(); }
};

document.addEventListener('click', e => {
  const el=e.target.closest('[data-act]'); if(!el) return;
  if(el.tagName==='INPUT' && el.type==='radio'){ A[el.dataset.act](el.dataset); return; }
  e.preventDefault(); const f=A[el.dataset.act]; if(f) f(el.dataset, el);
});
document.addEventListener('input', e => {
  const el=e.target, k=el.dataset && el.dataset.in; if(!k) return;
  if(['q','state','prog'].includes(k)){ S.filters[k]=el.value; document.getElementById('projRows').innerHTML=projRows(); return; }
  if(k==='tradeQty'){ S.trade.qty=el.value; const lot=S.lots.find(l=>l.id===S.trade.lot), q=Math.max(0,parseInt(el.value.replace(/,/g,''))||0), sub=q*lot.price, fee=Math.round(q*0.1*100)/100, bad=q<100||q>lot.qty;
    document.getElementById('tLine').textContent=nf(q)+' × '+rm(lot.price); document.getElementById('tSub').textContent=rm(sub); document.getElementById('tFee').textContent=rm(fee); document.getElementById('tTot').textContent=rm(sub+fee);
    const b=document.getElementById('payBtn'); b.disabled=bad; b.textContent='Pay '+rm(sub+fee);
    document.getElementById('tErr').innerHTML = bad?`<div class="err" style="margin-top:10px">Enter a quantity between 100 and ${nf(lot.qty)}.</div>`:''; return; }
  if(k==='retQty'){ S.ret.qty=el.value; const b=S.blocks.find(x=>x.id===S.ret.block), q=parseInt(el.value.replace(/,/g,''))||0, bad=!b||q<1||q>qtyOf(b);
    const btn=document.getElementById('retBtn'); btn.disabled=bad; btn.textContent='Retire '+nf(q)+' CCU';
    document.getElementById('rErr').innerHTML = bad?`<div class="err">Enter a quantity between 1 and ${b?nf(qtyOf(b)):0}.</div>`:''; return; }
  if(k==='retBen'){ S.ret.ben=el.value; return; }
  if(k==='retClaim'){ S.ret.claim=el.value; return; }
  if(k==='levyQty'){ S.levy.sel[el.dataset.id]=el.value.replace(/[^0-9]/g,''); document.getElementById('levyPanel').innerHTML=levyPanel(); return; }
});
document.addEventListener('change', e => {
  const el=e.target, k=el.dataset && el.dataset.in; if(!k) return;
  if(k==='retBlock'){ S.ret.block=el.value; const b=S.blocks.find(x=>x.id===el.value); S.ret.qty=Math.min(+S.ret.qty||1, qtyOf(b)); render(); }
  if(k==='retPurpose'){ S.ret.purpose=el.value; }
});
document.addEventListener('submit', e => e.preventDefault());
render();
</script>
</body>
